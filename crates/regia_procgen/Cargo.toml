[package]
name = "regia_procgen"
description = "Procedural content graphs: point sets with attributes, graph assets and variants, a deterministic evaluator, the built-in node library and generator components (specs 62, 63)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# File writing (graph saves, bake output). On in the editor and the CLI; off in shipping games, which
# only read graphs and `.pgout` files (spec 62 § 11).
pipeline = []

[dependencies]
regia_core = { workspace = true }
regia_ecs = { workspace = true }
regia_app = { workspace = true }
regia_scene = { workspace = true }
regia_terrain = { workspace = true }
regia_render = { workspace = true }
# Bakes a packaged game reads from its paks (spec 62 § 8, ADR-7214).
regia_asset = { workspace = true }
# `in.rays`: downward ray grids captured from the physics world (spec 63 § 3).
regia_physics = { workspace = true }
# Parallel evaluation (spec 62 § 5.1): dedicated pools of a chosen size (`Parallelism::threads`);
# the global compute pool comes through `regia_core::tasks`.
bevy_tasks = { workspace = true }
blake3 = { workspace = true }
i_overlay = { workspace = true }
parking_lot = { workspace = true }
# `in.mask` reads a PNG from the project when the host holds no CPU copy (spec 63 § 3).
png = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# `.biome.ron` definitions (spec 65): typed with field defaults.
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
regia_test_utils = { workspace = true }

# Spec 63 § 15 per-node budgets at 1 M points: `cargo bench -p regia_procgen --bench nodes`.
[[bench]]
name = "nodes"
harness = false

# Spec 64 § 10 budgets: `cargo bench -p regia_procgen --bench splines`.
[[bench]]
name = "splines"
harness = false

# Spec 62 § 12 graph budgets (200-node compile, 1 km ground pipeline):
# `cargo bench -p regia_procgen --bench graph`.
[[bench]]
name = "graph"
harness = false

# Writing bakes needs the `pipeline` feature; `cargo test --workspace` enables it through
# regia_agent (feature unification), `cargo test -p regia_procgen --features pipeline` alone.
[[test]]
name = "bake"
required-features = ["pipeline"]

# Mesh envelopes use plant nodes (spec 68 § 4).
[[test]]
name = "plant_envelope"
required-features = ["pipeline"]

# Plant node types exist only with the `pipeline` feature (spec 68 § 2).
[[test]]
name = "plants"
required-features = ["pipeline"]

# Bakes need the `pipeline` feature.
[[test]]
name = "world_outputs"
required-features = ["pipeline"]

# Runtime gaps (ADR-2421): bakes need the `pipeline` feature.
[[test]]
name = "runtime_gaps"
required-features = ["pipeline"]

# Spec 68 conformance tests (plant nodes need the `pipeline` feature).
[[test]]
name = "plants_conformance"
required-features = ["pipeline"]
