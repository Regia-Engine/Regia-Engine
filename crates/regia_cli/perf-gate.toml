# Session-summary performance gate (ADR-8429).
#
# One default row per resolution class and tier. A map name that has no row of its own
# uses that default. Operator files may add map rows; this shipped file has none.
# Frame-time numbers are the class/tier defaults the gate was specified with.
# Hitch, RSS and VRAM caps are settings (the brief requires them). They are loose
# enough that a quiet 16.6 ms window is not a hitch and a missing memory sample is skipped.

