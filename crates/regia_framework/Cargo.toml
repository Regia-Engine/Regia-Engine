required-features = ["net"]

[[example]]
name = "net_character_bench"
required-features = ["net"]

[[test]]
name = "net_vehicle"
required-features = ["net"]

# Hover hulls in the predicted schedule (spec 73 § 9.2, ADR-8819).
[[test]]
name = "net_hover"
required-features = ["net"]

[[example]]
name = "net_vehicle_bench"
required-features = ["net"]

[[test]]
name = "net_session_rules"
required-features = ["net"]

[[test]]
name = "net_session_players"
required-features = ["net"]

[[test]]
name = "server_persistence"
required-features = ["net"]

[[test]]
name = "traversal_net"
required-features = ["net"]

[[test]]
name = "net_host_rotation"
required-features = ["net"]

[[test]]
name = "fog_relevance"
required-features = ["net"]

[[test]]
name = "match_state_replication"
required-features = ["net"]

[[example]]
name = "fog_relevance_cost"
required-features = ["net"]

[[example]]
name = "match_state_bandwidth"
required-features = ["net"]

# The `locomotion` gizmo overlay (ADR-8729). `client` links regia_render and regia_ui.
[[test]]
name = "locomotion_gizmos"
required-features = ["client"]
