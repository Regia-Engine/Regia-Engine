[package]
name = "regia_vfx"
description = "GPU particle VFX, projected decals, cosmetic debris events and camera shake."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regia_core = { workspace = true }
regia_ecs = { workspace = true }
regia_app = { workspace = true }
regia_scene = { workspace = true }
regia_render = { workspace = true }
regia_asset = { workspace = true }
regia_platform = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The hot-reload test drives the dev source watcher.
regia_asset = { workspace = true, features = ["dev-assets"] }
regia_test_utils = { workspace = true }
regia_terrain = { workspace = true }
png = { workspace = true }
# The empty-layer allocation test counts the encode workers too (ADR-2585).
regia_render = { workspace = true, features = ["test-hooks"] }
