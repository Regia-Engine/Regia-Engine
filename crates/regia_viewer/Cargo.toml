[package]
name = "regia_viewer"
description = "Lean product viewer renderer: one forward pass, environment light, uniform buffers and textures only (native, WebGPU, WebGL2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# PNG stills (`Still::encode_png`), for the agent surface. Off in the web player and the Android viewer.
tools = ["dep:png"]

[dependencies]
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
png = { workspace = true, optional = true }

# The browser build carries both WebGPU (wgpu's default) and the WebGL2 fallback. Scoped to wasm32, so
# no native build sees the feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }
png = { workspace = true }

[[bin]]
name = "regia_viewer_bake_env"
path = "src/bin/regia_viewer_bake_env.rs"

[[example]]
name = "viewer_bench"
path = "examples/viewer_bench.rs"
