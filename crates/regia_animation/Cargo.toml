[package]
name = "regia_animation"
description = "Skeletal animation: clips, blend trees, state machines, IK, root motion, property tracks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regia_core = { workspace = true }
regia_ecs = { workspace = true }
regia_app = { workspace = true }
regia_asset = { workspace = true }
regia_scene = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Crowd and pose math with the same bits on x86_64 and aarch64 (ADR-5176); off by default.
cross-platform-determinism = ["regia_core/cross-platform-determinism"]

[dev-dependencies]
regia_test_utils = { workspace = true }
