[package]
name = "regia_asset_pipeline"
description = "Desktop-only importers, cookers, asset database and pak writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# ADR-7972: the importers and the `https://` cache client that bring C libraries, a TLS stack or
# large parsers are features, all on by default, so the editor, the CLI and every current host build
# exactly as before. A player build that cooks glTF at run time writes
# `regia_asset_pipeline = { ..., default-features = false }` and keeps glTF, images, textures,
# meshes, the pak writer and the `file://`/directory/`http://` caches. With a feature off, importing
# its formats returns `ImportError::ImporterDisabled` (agent code `importer_disabled`) and an
# `https://` cache URL fails with `cook_cache_https_disabled`; `cargo xtask check-layers` keeps the
# off side free of the crates listed here.
[features]
default = ["http_cache", "fbx_import", "usd_import", "svg_import", "audio_transcode"]
# `https://` shared cook caches (ADR-2710): ureq + rustls (`ring`, web PKI roots).
http_cache = ["dep:ureq"]
# FBX import (ADR-1602): the ufbx C library.
fbx_import = ["dep:ufbx"]
# USD import (ADR-3235): the `openusd` reader.
usd_import = ["dep:openusd"]
# SVG import (ADR-3350): resvg, usvg and the tiny-skia pixmap they draw into.
svg_import = ["dep:resvg", "dep:usvg", "dep:tiny-skia"]
# The Ogg Vorbis cook transcode (ADR-3230): libvorbis through vorbis_rs, kira's decoder for the input.
audio_transcode = ["dep:vorbis_rs", "dep:kira"]

[dependencies]
regia_core = { workspace = true }
regia_ecs = { workspace = true }
# `dev-assets`: the live cooker builds on the debounced source watcher (desktop tools only).
regia_asset = { workspace = true, features = ["dev-assets"] }
regia_terrain = { workspace = true }
# Terrain mesh layers (spec 26 § 2a.5, ADR-8398): W-06's canonical writer and cooked format.
regia_world_geom = { workspace = true }
regia_scene = { workspace = true }
# Streamed-level cook: the cooked `.wstream` and `.wcell` types (spec 78 § 4.1).
regia_world = { workspace = true }
regia_render = { workspace = true }
regia_animation = { workspace = true }
regia_audio = { workspace = true }
# Audio cook transcode (ADR-3230): the runtime decoder's frames in, Ogg Vorbis out (pipeline-only).
kira = { workspace = true, optional = true }
vorbis_rs = { workspace = true, optional = true }
regia_physics = { workspace = true }
# `.fluidcache` bakes cook into paks (`fluid_cook`, ADR-2577).
regia_fluid = { workspace = true }
regia_nav = { workspace = true }
regia_matgraph = { workspace = true }
regia_2d = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }
intel_tex_2 = { workspace = true }
ctt-astcenc = { workspace = true }
meshopt = { workspace = true }
# Data tables (`data_cook`): the loaders that validate them and write their cooked form.
regia_framework = { workspace = true }
regia_ai = { workspace = true }
# `.netprofile.ron` (`data_cook`, ADR-7232): the profile's own parse and checks.
regia_net = { workspace = true }
# Plant exports (spec 68 § 6.3): `regia_procgen` records the job, this crate writes the glTF.
regia_procgen = { workspace = true, features = ["pipeline"] }
# Video import and cook (`webm_cook`, specs/50 § 4, ADR-2410): validation and the cooked payload.
regia_media = { workspace = true }
bevy_mikktspace = { workspace = true }
notify = { workspace = true }
walkdir = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
# `lod_classes.toml`, the per-class LOD screen-size table (ADR-260, lane v0119d).
toml = { workspace = true }
postcard = { workspace = true }
lz4_flex = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ktx2 = { workspace = true }
tiled = { workspace = true }
texture_packer = { workspace = true }
# SVG import (ADR-3350): pipeline only, forbidden in runtime crates by check-layers.
resvg = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
# Shared by SVG and MaterialX (ADR-3350, ADR-3341); DTDs are refused by both importers.
roxmltree = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
# FBX import (ADR-1602): pipeline-only FFI to the ufbx C library, the `fbx_import` feature (ADR-7972).
ufbx = { workspace = true, optional = true }
# USD import (ADR-3235): the pure-Rust `openusd` reader (.usda, .usdc, .usdz, composition), the `usd_import` feature.
openusd = { workspace = true, optional = true }
# Font subsetting (`font_subset`, ADR-2697): read fonts with the same skrifa as cosmic-text, the shipped locales' text
# from `regia_ui`'s localization tools, and cosmic-text, the engine's shaper, to see which glyphs that text's grapheme
# clusters reach.
skrifa = { workspace = true }
regia_ui = { workspace = true }
cosmic-text = { workspace = true }
unicode-segmentation = { workspace = true }

# `https://` shared cook caches (ADR-2710): the workspace's ureq + rustls stack (`ring` provider,
# web PKI roots), the same configuration as regia_crash and regia_asset/content-http. The `http_cache`
# feature (ADR-7972).
ureq = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# `rename_no_replace`: new `.meta` files are published with a no-replace move on Windows, not a
# hard link (ADR-8504). Already in the graph through regia_asset and regia_framework.
regia_platform = { path = "../regia_platform", default-features = false }

[dev-dependencies]
wgpu = { workspace = true }
# `#[derive(Asset)]` in the data asset cook test (ADR-7232).
regia_macros = { workspace = true }
regia_test_utils = { workspace = true }
# The live-reload test runs a real app around the asset server.
regia_app = { workspace = true }
uuid = { workspace = true }
image = { workspace = true }
regia_render = { workspace = true }
regia_asset = { workspace = true, features = ["dev-assets"] }
# Terrain mesh layer cook tests: the Stage A passage fixtures (DO27 layouts as data).
regia_world_geom = { workspace = true, features = ["fixtures", "stage_b"] }
# The `https://` shared cook cache test serves the cache over rustls with a self-signed
# certificate only the test's agent trusts (same pins as regia_asset's and regia_crash's tests).
# Test-only since ADR-7972: the library reaches rustls through ureq (`http_cache`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"

# Integration tests that call a feature's API directly (ADR-7972); the default build runs them all.
[[test]]
name = "fbx_import"
required-features = ["fbx_import"]

[[test]]
name = "usd_cook"
required-features = ["usd_import"]

[[test]]
name = "svg_import"
required-features = ["svg_import"]

[[test]]
name = "audio_transcode"
required-features = ["audio_transcode"]

[[test]]
name = "import_package_acceptance"
required-features = ["audio_transcode"]

[[test]]
name = "cook_shared_cache_https"
required-features = ["http_cache"]

[[test]]
name = "fuzz"
required-features = ["fbx_import", "usd_import", "svg_import"]
