[package]
name = "regia_dlss"
description = "NVIDIA DLSS Super Resolution through NGX on wgpu's Vulkan backend (ADR-2002): links the NGX SDK when DLSS_SDK is set at build time, otherwise a stub that reports not_linked."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wgpu = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Raw Vulkan handles for NGX (the version wgpu-hal 30 uses, so the handle types are the same).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { workspace = true }

[dev-dependencies]
# block_on for the GPU smoke test's adapter enumeration.
regia_core = { workspace = true }

# Bindings to the NGX headers and a C file for their inline helpers. Only with the `sdk`
# feature, and only used when DLSS_SDK names an SDK checkout at build time.
[build-dependencies]
bindgen = { workspace = true, optional = true }
cc = { workspace = true, optional = true }

[features]
# Link the NGX SDK named by the DLSS_SDK environment variable (an absolute path to NVIDIA's DLSS
# SDK checkout, never committed). Without DLSS_SDK the crate still builds, as the stub.
sdk = ["dep:bindgen", "dep:cc"]

# Renders frames through DLSS on a real NVIDIA GPU and compares them with the native frame.
# Skips unless REGIA_DLSS_SMOKE=1 (then it fails when DLSS cannot run).
[[test]]
name = "gpu_smoke"
required-features = ["sdk"]
