# CI for Regia Engine (docs/06-testing-and-ci.md § 5). The toolchain comes from rust-toolchain.toml.
# The linux job runs every check of the merge gate (`cargo xtask preflight`'s steps); xtask's ci_workflows test
# fails when a gate step is missing here (ADR-1379).
name: ci

on:
  # Only the evidence images, release notes and the progress log are skipped: crates compile files under
  # docs/formats/ and docs/ported-sources.toml in (include_str!), and the format tests parse them.
  push:
    branches: [main]
    paths-ignore: [docs/evidence/**, docs/releases/**, docs/progress.md, README.md, AGENTS.md, CLAUDE.md]
  pull_request:
    paths-ignore: [docs/evidence/**, docs/releases/**, docs/progress.md, README.md, AGENTS.md, CLAUDE.md]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTDOCFLAGS: -D warnings

jobs:
  linux:
    name: linux (fmt, clippy, test, doc, layers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        # mesa-vulkan-drivers = lavapipe (software Vulkan) for GPU tests; xvfb for the windowed smoke run.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Khronos glTF test assets
        run: cargo xtask fetch-test-assets
      - name: Khronos integration tests
        run: cargo test -p regia_asset_pipeline --test khronos_samples --test texture_hot_reload
        env:
          REGIA_KHRONOS_ASSETS: ${{ github.workspace }}/.regia/test-assets/khronos-gltf
      - name: M4 agent asset screenshot evidence (DamagedHelmet)
        run: xvfb-run -a cargo test -p regia_agent --test damaged_helmet_agent_screenshot --locked
        env:
          REGIA_WINIT_ANY_THREAD: "1"
          REGIA_KHRONOS_ASSETS: ${{ github.workspace }}/.regia/test-assets/khronos-gltf
      - name: No conflict markers (the gate refuses them)
        run: "! git grep --untracked -l -E '^(<<<<<<<|>>>>>>>) ' -- '*.rs' '*.toml' '*.md' '*.wgsl'"
      - run: cargo fmt --all -- --check
      - run: cargo xtask book-check --fences
      - run: cargo xtask check-layers
      - run: cargo xtask check-server-build
      # The ECS-free regia_net core (spec 120 § 15.5, ADR-8501): no ECS crate in its tree, it builds and runs its
      # headless two-client example without the `ecs` feature.
      - run: cargo xtask check-net-core
      - run: cargo xtask check-packaging
      - run: cargo xtask check-kinds
      - run: cargo xtask check-versions
      # The duplicate-version ratchet against docs/ci/duplicate-deps.txt (ADR-3301), right after check-versions as
      # in the gate.
      - run: cargo xtask duplicate-deps
      - run: cargo xtask check-unwraps
      # The lockstep determinism scan (ADR-8013, ADR-8367), as in the gate.
      - run: cargo xtask det-scan
      - run: cargo xtask check-formats
      - run: cargo xtask notices --check
      - run: cargo xtask demo-notices --check
      - run: cargo xtask spdx --check
      - run: cargo xtask book-check
      # The AI readme's index is current and the onboarding files agree with their contract and the CLI (ADR-10230).
      - run: cargo xtask llms-txt --check
      - run: cargo xtask onboarding-lint
      - run: cargo xtask check-shaders
      - run: cargo xtask api-snapshot
      - run: cargo xtask agent-examples
      # The compiled doc examples of the stable crates may not drop (ADR-2527 crates), as in the gate.
      - run: cargo xtask doc-examples
      - run: cargo xtask agent-snapshot
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The feature matrix (ADR-2322): clippy over every optional feature set the line above never builds
      # (dlss over the NGX check stub, steamworks, the media codecs, lua, xr, dcc-feed, the umbrella's
      # re-exports, the shipping builds with defaults off). Lists every failing row.
      - run: cargo xtask check-features
      - run: cargo test --workspace --locked
      - name: regia_net hub tests on the state channel (ADR-1950)
        run: cargo test -p regia_net --tests --locked
        env:
          REGIA_NET_TEST_STATE_CHANNEL: unreliable
      - run: cargo doc --workspace --no-deps --locked
      - name: hello_window smoke run (window, lavapipe, simulated suspend/resume)
        run: |
          cargo build -p hello_window --locked
          xvfb-run -a ./target/debug/hello_window --exit-after-frames 300 --simulate-suspend-every 60 2>&1 | tee smoke.log
          grep -q "300 frames done" smoke.log
          test "$(grep -c 'first frame presented after resume' smoke.log)" -ge 5
          ! grep -q "ERROR" smoke.log
      - name: agent protocol v0 smoke (drives hello_window through the protocol)
        run: |
          cargo build -p regia_agent --examples --locked
          xvfb-run -a sh -c '
            ./target/debug/hello_window > app.log 2>&1 &
            app=$!
            for i in $(seq 1 60); do [ -f samples/hello_window/.regia/agent/endpoint.json ] && break; sleep 0.5; done
            ./target/debug/examples/smoke samples/hello_window; rc=$?
            kill $app; exit $rc'
      - name: host strings (privacy gate over the release sample binary, ADR-10354)
        run: cargo xtask host-strings

  steam-runtime:
    # Linux packages must start in Steam Linux Runtime 3.0 "sniper" (glibc 2.31; ADR-148). Package a sample
    # against the 2.31 floor with cargo-zigbuild (the CLI fails the package above the floor) and re-check the
    # binary independently with objdump.
    name: linux package glibc floor (Steam runtime)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev binutils
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Package hello_window against glibc 2.31
        run: cargo run -p regia_cli --locked -- package --platform linux --glibc 2.31 --format dir --project samples/hello_window --out dist-steam
      - name: objdump -T max GLIBC <= 2.31
        run: |
          bin=$(find dist-steam -maxdepth 2 -type f -name hello_window | head -1)
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "$bin needs GLIBC_$max"
          test "$(printf '%s\n2.31\n' "$max" | sort -V | tail -1)" = "2.31"

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  android:
    name: android (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Check
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 clippy -p regia -p hello_window -p hello_window_android --locked -- -D warnings
          cargo ndk -t arm64-v8a -t x86_64 -P 29 build -p hello_window_android --locked   # API 29 = samples' min_sdk; AAudio needs 26+

  web-player:
    # The web player builds for the browser (ADR-2541): the module, plus lint on the browser-only code no other
    # job compiles.
    name: web player (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Target
        run: rustup target add wasm32-unknown-unknown
      - name: Build
        run: cargo build --target wasm32-unknown-unknown -p regia_web --locked
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -p regia_web --locked --no-deps -- -D warnings

  media-feature:
    # The compressed media codecs (docs/06 § 5, ADR-1593 § 5, ADR-1869): rav1d, unsafe-libopus and lewton
    # build with no system NASM or Meson for Linux, Android aarch64 (rav1d's arm64 assembly through cc) and
    # Windows (clang-cl through cargo-xwin), and the codec fixtures and the fuzz corpus run on Linux.
    # `av1-nasm` is not here: it needs NASM, which this job keeps out on purpose.
    name: media-feature (codecs on linux, android, windows-msvc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries and clang (clang-cl, lld-link, llvm-lib)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev clang lld llvm
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Clippy and tests (linux)
        run: |
          cargo clippy -p regia_media --features video,voice-opus --all-targets --locked -- -D warnings
          cargo test -p regia_media --features video,voice-opus --locked
      - name: Clippy (android aarch64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a clippy -p regia_media --features video,voice-opus --all-targets --locked -- -D warnings
      - name: Install cargo-xwin
        run: |
          curl -sSfL -o /tmp/cargo-xwin.tar.gz https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-xwin.tar.gz -C "$HOME/.cargo/bin"
      - name: Clippy (windows-msvc)
        # Allowed to fail like `windows-cross` until that job has been seen green once (ADR-295).
        continue-on-error: true
        run: cargo xwin clippy -p regia_media --features video,voice-opus --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
        env:
          XWIN_ACCEPT_LICENSE: "1"

  templates:
    # `regia new` for every template, `cargo build` of the generated workspace, and the generated
    # game for five frames under xvfb (lavapipe): a template that does not compile or start fails
    # here (docs/06 § 5, ADR-2046).
    name: templates (new, build, smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: templates-check
        run: xvfb-run -a cargo xtask templates-check
        env:
          REGIA_WINIT_ANY_THREAD: "1"

  windows-cross:
    # Compile and lint only (ADR-295). ADR-009: no hosted Windows runners, so this is clang-cl via
    # cargo-xwin on ubuntu, not a Windows VM. Tests, goldens and GPU runs stay on the `windows` job.
    # continue-on-error until the clang-cl SSE4.1 workaround below has been seen green once.
    name: windows (cross clippy, msvc)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (clang-cl, lld-link, llvm-lib)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - name: clang-cl with SSE4.1 flags
        # ctt-astcenc 0.6 builds its SSE4.1 variant with no MSVC flags; cl.exe accepts the
        # intrinsics, clang-cl rejects them. A same-named wrapper first on PATH adds the GNU ISA
        # flags (clang-cl accepts them) for every C++ compile, with no vendored copy of the crate.
        # Put them before "$@": cc-rs puts -- before assembly inputs, after which flags are filenames.
        run: |
          real=$(command -v clang-cl)
          mkdir -p "$HOME/clang-cl-wrap"
          printf '#!/bin/sh\nexec %s -msse4.1 -mpopcnt -mf16c "$@"\n' "$real" > "$HOME/clang-cl-wrap/clang-cl"
          chmod +x "$HOME/clang-cl-wrap/clang-cl"
          echo "$HOME/clang-cl-wrap" >> "$GITHUB_PATH"
      - name: Install cargo-xwin
        run: |
          curl -sSfL -o /tmp/cargo-xwin.tar.gz https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-xwin.tar.gz -C "$HOME/.cargo/bin"
          cargo xwin --version
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-17-${{ runner.os }}-x86_64
      - name: Clippy (windows-msvc)
        run: cargo xwin clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
        env:
          XWIN_ACCEPT_LICENSE: "1"
          CARGO_INCREMENTAL: "0"

  docs:
    # docs/06 § 5 `docs`: the book's link, schema-coverage and summary checks, then the mdBook build when
    # mdbook is on the runner (rustdoc -D warnings is a step of the `linux` job).
    name: docs (book-check, mdbook)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: cargo xtask book-check
      - name: mdBook build
        run: |
          if command -v mdbook >/dev/null 2>&1; then
            mdbook build book
          else
            echo "mdbook is not installed in this job; book-check above covered the book"
          fi

  package:
    # docs/06 § 5 `package`: cargo xtask package-smoke (ADR-3968). Dev and shipping Linux tarballs of
    # samples/sim_bridge and a regia new third_person project, each run 60 s under xvfb (lavapipe) with
    # scripted input playback. The game exits itself so summary.json is written. Shipping uses zig 0.14.1.
    name: package (linux, packaged smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build regia
        run: cargo build --locked -p regia_cli --bin regia
      - name: Package and smoke
        env:
          REGIA_WINIT_ANY_THREAD: "1"
          REGIA_AUDIO: "off"
        run: cargo --locked xtask package-smoke
      - name: Preserve package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-linux
          path: |
            target/package-smoke/package-smoke.json
            target/package-smoke/linux/**/*.jsonl
            target/package-smoke/linux/**/*.summary.json
          if-no-files-found: warn

  agent-protocol:
    # docs/06 § 5 `agent-protocol`: the MCP server over stdio answers initialize and tools/list, then the
    # CLI's protocol tests; the MCP conformance test runs once its file exists (lane agent-bench-conformance).
    name: agent protocol (mcp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build regia
        run: cargo build --locked -p regia_cli --bin regia
      - name: MCP stdio smoke
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            ; sleep 5; } | timeout 60 target/debug/regia mcp --project "$project" --attach > "$project/mcp.out" || true
          grep -q '"id":2' "$project/mcp.out" && grep -q '"tools"' "$project/mcp.out" || { cat "$project/mcp.out"; echo "no tools/list answer over stdio"; exit 1; }
      - run: cargo test --locked -p regia_cli --test mcp
      - name: MCP conformance
        run: |
          if [ -f crates/regia_cli/tests/mcp_conformance.rs ]; then
            cargo test --locked -p regia_cli --test mcp_conformance
          else
            echo "crates/regia_cli/tests/mcp_conformance.rs does not exist yet; skipped"
          fi

  android-smoke:
    # docs/06 § 5 `android-smoke` (ADR-3968). sim_bridge APK and AAB (manifest ABIs: arm64-v8a and
    # x86_64), sizes against the 150 MB shipping-APK limit, then an x86_64 API 35 emulator smoke.
    # this job pins the android-35 image the farm already has.
    name: android-smoke (x86_64 emulator, API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK (keytool) and system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev
      - name: KVM for the runner user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Gradle 8.14.3
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      - name: Install the API 35 x86_64 system image
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ANDROID_SDK_ROOT"
          sdkmanager=""
          for candidate in "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then sdkmanager="$candidate"; break; fi
          done
          if [ -z "$sdkmanager" ] && command -v sdkmanager >/dev/null 2>&1; then sdkmanager="$(command -v sdkmanager)"; fi
          test -n "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools"
      - name: Package and emulator smoke
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          cargo --locked xtask package-smoke --skip-linux --android --android-emulator --require-kvm --sdk "$ANDROID_SDK_ROOT"
      - name: Preserve Android package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-android
          path: |
            target/package-smoke/package-smoke.json
            target/package-smoke/logcat-*.txt
            target/package-smoke/android/**/*.apk
            target/package-smoke/android/**/*.aab
          if-no-files-found: warn
