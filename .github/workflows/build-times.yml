# Build-time report against the budgets in docs/03-workspace-and-dependencies.md § 6.
# Report only until M3; from M3 a regression over 20% fails (docs/06 § 5).
name: build-times

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .cargo/**, rust-toolchain.toml, .github/workflows/build-times.yml]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev libwayland-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask build-times
      - run: cat target/build-times/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build-times-linux
          path: |
            target/build-times/report.*
            target/build-times/target/cargo-timings/
