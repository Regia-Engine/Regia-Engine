format_version = 1
id = "close-the-gate"
title = "Close the corridor with a navigation obstacle"
prompt = "The level has a flat 8 m by 8 m walkable floor (x and z from -4 to 4). Add a navigation obstacle that cuts the floor in two, so that no path exists from (-3, 0, 0) to (3, 0, 0)."
features = ["nav"]
crates = ["regia_agent", "regia_nav"]
call_budget = 6

[setup]
target = "nav"

[[check]]
name = "no path across"
method = "nav.find_path"
params = { from = [-3, 0, 0], to = [3, 0, 0] }
pointer = "/path"
expect = { kind = "absent" }

[[check]]
name = "a path on one side still exists"
method = "nav.find_path"
params = { from = [-3, 0, -3], to = [-3, 0, 3] }
pointer = "/path/length"
expect = { kind = "number_range", min = 5.5, max = 6.5 }
