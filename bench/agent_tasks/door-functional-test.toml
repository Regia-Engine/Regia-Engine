format_version = 1
id = "door-functional-test"
title = "Open the door and prove it with a functional test"
prompt = "The entity 'Door' is closed at height 0. Open it by raising it to y = 3. Then add a functional test named 'door_is_open' (a script test stored at tests/door_is_open.functest.ron) that checks the Door's height is at least 2.5, run it, and make sure it passes."
features = ["scripting", "scene"]
crates = ["regia_agent", "regia_framework"]
call_budget = 10

[setup]
target = "scripting"

[[setup.call]]
method = "scene.spawn"
params = { name = "Door", components = { Transform = { translation = [0, 0, 0] } } }
save = { d = "/entity" }

[[check]]
name = "door is open"
method = "play.expect"
params = { assertions = [{ name = "up", condition = { entity = { name = "Door" }, component = "Transform", path = "translation.y", op = "gte", value = 2.5 } }] }
pointer = "/pass"
expect = { kind = "equals", value = true }

[[check]]
name = "test passed"
method = "functest.results"
pointer = "/tests/0/verdict"
expect = { kind = "equals", value = "Passed" }

[[check]]
name = "the right test"
method = "functest.results"
pointer = "/tests/0/name"
expect = { kind = "equals", value = "door_is_open" }
