# ---- Notices (ADR-8888) ----------------------------------------------------------------------
#
# Every tracked file whose row above is `origin = "third_party"` and `ships = true` must be covered
# by a `[[notice]]` row, or `cargo xtask notices --check` fails. `cargo xtask notices` writes each
# row into THIRD_PARTY_NOTICES.md ("Bundled fonts and assets") with the `Copyright` lines of its
# licence file, and the licence text once per licence (the full SIL OFL 1.1 text for fonts).
#
# Fields:
#   name          display name
#   licence       SPDX identifier the files are used under
#   files         repository-relative paths or globs of the covered files
#   licence_file  the licence text that ships beside the files (its `Copyright` lines are copied;
#                 never type them by hand)
#   ported        instead of licence_file: the `project` of the docs/ported-sources.toml entry
#                 that carries the copyright and licence

