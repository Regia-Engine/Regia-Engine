# Licence record for every binary asset tracked in the repository outside `docs/`, `spikes/` and
# `vendor/` (ADR-2760).
#
# Hand-maintained. `cargo xtask notices --check` fails when a tracked binary file (the extension
# list is `ASSET_EXTENSIONS` in `xtask/src/notices.rs`) matches no row, when a row matches no file, or when
# a row is incomplete. A row with `licence = "unknown"` is a warning; `cargo xtask notices --check
# --strict` fails on it. `cargo xtask sbom` lists these rows in its inventory.
#
# Fields:
#   path    repository-relative path or glob (`*` stays inside one folder, `**` crosses folders)
#   origin  "authored"    written or drawn for Regia Engine
#           "generated"   written by a tool or test (renders, encoder output, recorded traces)
#           "third_party" taken from another project
#   source  where it came from, in words
#   licence SPDX identifier or expression; `LicenseRef-Regia-Engine` for our own work; "unknown" when
#           nobody has recorded it yet
#   ships   true when a packaged build or the published manual can contain the file
#
# Do not guess a licence: put "unknown" and ask the owner (docs/progress.md, "Questions for owner").

# ---- Shipped ---------------------------------------------------------------------------------

[[asset]]
path = "crates/regia_ui/assets/fonts/*.ttf"
origin = "third_party"
source = "google/fonts (Inter, Noto families) and googlefonts/noto-emoji; subsets made by subset.py; see the README in that folder"
licence = "OFL-1.1"
ships = true

