# Source code ported into Regia Engine from permissively licensed projects (docs/01-cleanroom.md § 2, ADR-086).
#
# Hand-maintained. `cargo xtask notices` renders it as the "Ported source code" section of
# THIRD_PARTY_NOTICES.md (which ships in every packaged build), and `cargo xtask notices --check`
# (CI) fails when an entry is incomplete, its licence is not permissive, a `files_to` path does not
# exist, or a ported file lacks its attribution header. Never edit THIRD_PARTY_NOTICES.md by hand.
#
# One `[[source]]` entry per upstream project and commit.
#
# `[[do27]]` rows (ADR-8012): code from the owner's own game, Direct Order 27, copied under the owner's
# 2026-11-16 exception (docs/01-cleanroom.md § 3d, specs/25 § 2). One row per DO27 file or line range; not
# rendered into the notices. `cargo xtask notices --check` fails a row without these fields or with a
# forbidden class, and a copied file without its header or with a DO27 identifier:
#
#   [[do27]]
#   crate = "ir-sim"                # DO27 crate or top-level folder
#   path = "src/math.rs"            # path inside it
#   lines = "all"                   # or a one-based range "A-B"
#   sha = "f7e8f4740"               # the DO27 commit read (9-40 lowercase hex)
#   mark = "as-is"                  # as-is | adapt | requirements (binding; requirements is never copied)
#   class = "P3"                    # P1 (requirements only) | P2 (needs cleared_by) | P3; never P4/P5; P6 is a [[source]]
#   cleared_by = ""                 # P2 copies: the per-file review that cleared the file (e.g. "D-02")
#   note = ""                       # adapt: the named issue the change fixes; renamed DO27 fields
#   files_to = ["crates/regia_detsim/src/math.rs"]   # copied files start with
#   # "// Portions copied from Direct Order 27 (ir-sim/src/math.rs, commit f7e8f4740), ADR-8012."
#   planned = "F-01"                # draft row (ADR-8041): the plan lane that will copy the file; until it lands,
#                                   # `files_to` may be empty and nothing is checked on disk. The lane deletes it.

