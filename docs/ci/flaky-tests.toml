# ADR-8599 (v06-pregate-reds-e): the regia_render lib test process fills a the build server RTX 5090's BAR1 by itself (256 MiB,
# resizable BAR off; 253 MiB at its peak, the integ-v038 measurement), so every other GPU test process that creates a
# device on that card while it runs gets "Parent device is lost". The pregate on integ-v06r 0f89ab970 put it on card 7
# beside regia_editor viewport_render, which then failed all 10 tests in vkCreateDevice (green alone in 22 s).
[[flake]]
id = "render-lib-bar1-card"
tests = ["regia_render:regia_render:lib"]
symptom = "Other binaries on the same card fail every test in vkCreateDevice ('Parent device is lost'; the kernel logs NVRM dmaAllocMapping_GM107: can't alloc VA space). Pregate integ-v06r 0f89ab970 card 7, 2026-11-18 10:46: regia_editor viewport_render 0 of 10 while regia_render lib ran (10 failed device creations of its own, also alone on the card)."
cause = "BAR1 exhaustion on an RTX 5090 with resizable BAR off: the regia_render lib binary keeps about 5 MiB of BAR1 per kept device and peaks at 253 of 256 MiB."
status = "open"
handling = "solo"
passes = ["gpu"]
owner = "the lead (wire `--solo regia_render:regia_render:lib` into the GPU pass of the gate script and the pregate; resizable BAR is an owner hardware option)"
seen = ["2026-11-18"]
review_by = "2026-12-16"
refs = ["ADR-8599", "integ-v038 decisions (5): BAR1 measurement", "pregate 0f89ab970 card 7"]

# ADR-8599 (v06-pregate-reds-e): a CPU-only determinism stress (120 record/replay runs of the arena match, 240 fixed steps
# each, one after another) whose time follows host load. Not a hang and not a regression: interleaved on the test machine at
# load 28-37, integ-v06r 6fe730622 took 53.2 / 61.9 / 39.8 s and integ-v06n c7cacd5db 52.1 / 43.1 / 60.4 s.
[[flake]]
id = "arena-repro-check-load"
tests = ["arena:repro_check:test"]
test_fns = ["twenty_seeds_of_the_bot_match_replay_identically"]
symptom = "No result after 600 s beside other binaries and alone on the pregate (integ-v06r 0f89ab970 card 3, integ-v06r-net 3793fd1be); the lavapipe recheck passed in 589 s and the 6fe730622 card run in 495 s. Pregate times since 11-15 run from 96 s to over 600 s with the host's load (the build server 1-minute load about 450 on 128 threads on 11-18)."
cause = "Host load: 28,800 app updates through the multi-threaded executor plus a reflected-state snapshot every checkpoint, about 10 times slower at the build server's load than on the test machine."
status = "open"
handling = "solo"
passes = ["lvp", "gpu"]
owner = "the lead"
seen = ["2026-11-18"]
review_by = "2026-12-16"
refs = ["ADR-8599", "pregate 0f89ab970 card 3", "pregate 3793fd1be"]

