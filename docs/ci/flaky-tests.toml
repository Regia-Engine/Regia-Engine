# Flaky-test registry (ADR-1035). Read by `cargo xtask flaky`; the policy is book/user-guide/flaky-tests.md.
#
# One [[flake]] per known flaky or load-sensitive test binary (or family). `tests` are the gate runner's binary
# keys `package:target:kind`, as gate-runtests.py prints them (`FAILED <key>`, `FLAKY UNDER LOAD <key>`).
# `cargo xtask flaky --check` fails when a package, target or `test_fns` entry does not exist, so a rename
# cannot leave a stale row. `cargo xtask flaky --gate-args lvp|gpu` prints the runner's `--solo` and
# `--quarantine` arguments; the gate scripts take their lists from there.
#
# status:   open | mitigated | fixed | latent (load-sensitive shape, not seen failing)
# handling: none (the runner's rerun-alone rule only) | solo (runs alone after the pool) |
#           quarantine (real-GPU pass only: reported, not counted) | exit-crash (the runner's exit-crash rule)
# History of the fixed 2026-10-06/07 flakes: docs/evidence/flaky-tests/README.md.

version = 1

[[flake]]
id = "nvidia-exit-sigsegv"
tests = ["lookdev:warm_coverage:test", "regia:device_lost_exit:test"]
symptom = "The process dies with signal 11 at exit after every test printed ok (warm_coverage), or exits with a signal instead of code 3 (device_lost_exit). RTX 5090, driver 615.71.09, under gate or build load; idle it passed 30 of 30."
cause = "A worker thread (material-graph, pipeline warm, telemetry probe) is still inside the NVIDIA driver when exit() runs the process-exit handlers. No Rust-side defect found (docs/notes/heap-trace.md)."
status = "mitigated"
handling = "exit-crash"
passes = ["gpu"]
owner = "sprint lane 05 exit-workers (normal-quit leftovers); the lead runs the loaded 60-run soak"
seen = ["2026-10-17"]
review_by = "2026-10-28"
refs = ["ADR-269", "ADR-276", "docs/notes/heap-trace.md", "reports/exit-race-devicelost.md"]

