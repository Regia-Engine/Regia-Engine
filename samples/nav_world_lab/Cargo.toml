[package]
name = "nav_world_lab"
description = "Headless nav world lab: area costs from a level table, streamed tiles with crowds waiting at unloaded edges, two-way lanes with preferences, a ragdoll drop test (ADR-2133), and four AI cars lapping an oval of lanes (ADR-3117)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT-0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
regia_animation = { workspace = true }
regia_core = { workspace = true }
regia_framework = { workspace = true }
regia_nav = { workspace = true }
# Traffic (ADR-3117): four AI cars on physics vehicles lap an oval of lanes.
regia_app = { workspace = true }
regia_physics = { workspace = true }
regia_scene = { workspace = true }

[features]
# Cross-host comparisons (ADR-5128): rapier's software libm (`physics-cross-platform-determinism`,
# spec 15 § 5) so the ragdoll and traffic sections give the same bits on every OS. Off by default
# like the engine feature it forwards to; the nav, crowd and lane sections agree without it.
cross-platform-determinism = ["regia_physics/physics-cross-platform-determinism"]

[dev-dependencies]
# The traffic agent smoke test drives the lab over the real agent protocol.
regia = { workspace = true }
regia_agent = { workspace = true }
regia_test_utils = { workspace = true }
serde_json = { workspace = true }
