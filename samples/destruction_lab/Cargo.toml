[package]
name = "destruction_lab"
description = "Destruction level 2 end to end (ADR-2573): a pre-fractured wall and tower, a server and two clients in one process, scripted explosions; the server decides, both clients play the same chunks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT-0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
regia = { path = "../../crates/regia", default-features = false, features = ["client", "agent", "net", "explosion-fx", "destruction-fx"] }
regia_render = { workspace = true }
regia_scene = { workspace = true }
regia_vfx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# The fracture tool is pipeline code, which a sample's runtime may not link (02 § 1, 06 § 7): the kit
# is cut in the tests and in the example, from primitives, and handed to the library.
[dev-dependencies]
png = { workspace = true }
regia_asset = { workspace = true }
regia_asset_pipeline = { workspace = true }
regia_test_utils = { workspace = true }
