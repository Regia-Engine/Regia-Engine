[package]
name = "third_person"
description = "Third-person demo (M20 slice + combat, ADR-2596): rapier character, boom camera, animated Fox with foot IK, collectibles, behavior-tree enemies on a navmesh crowd, a montage melee combo, ragdoll deaths, checkpoints, title and settings menus, procedural sound, saves through the save flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT-0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
regia = { workspace = true }
regia_ai = { workspace = true }
regia_animation = { workspace = true }
regia_app = { workspace = true }
regia_asset = { workspace = true }
regia_audio = { workspace = true }
regia_core = { workspace = true }
regia_ecs = { workspace = true }
regia_framework = { workspace = true }
regia_input = { workspace = true }
regia_macros = { workspace = true }
regia_nav = { workspace = true }
regia_physics = { workspace = true }
regia_platform = { workspace = true }
regia_render = { workspace = true }
regia_scene = { workspace = true }
regia_ui = { workspace = true }
# `.bt.ron` behavior trees are parsed with the workspace's `ron` (ADR-2596).
ron = { workspace = true }
tracing = { workspace = true }

# Screenshot PNG encoding for the --screenshot flag (same crate the agent protocol uses).
png = { workspace = true }

[dev-dependencies]
regia_agent = { workspace = true }
regia_test_utils = { workspace = true }
gltf = { workspace = true }
serde_json = { workspace = true }
# tests/car_render_agent.rs decodes the offscreen screenshot (ADR-2134).
png = { workspace = true }
