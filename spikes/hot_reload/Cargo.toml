# M2 hot-reload spike (docs/specs/20-hot-reload.md, docs/05-milestones.md M2).
# Its own workspace so it never touches the engine workspace. Engine crates are path dependencies.
# The subsecond (hot-patching) half lives in ./subsecond, a separate workspace (different bevy_ecs
# feature set; keeping it apart avoids rebuilding the whole engine when switching).
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["subsecond"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
regia = { path = "../../crates/regia" }
regia_app = { path = "../../crates/regia_app" }
regia_ecs = { path = "../../crates/regia_ecs" }
regia_agent = { path = "../../crates/regia_agent" }
spike_engine = { path = "crates/spike_engine" }
spike_engine_dylib = { path = "crates/spike_engine_dylib" }
spike_regia = { path = "crates/spike_regia" }
sim = { path = "crates/sim" }
sim_dylib = { path = "crates/sim_dylib" }
game = { path = "crates/game" }

# Same pins and features as the engine workspace so the lockfile and feature sets match.
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "bevy_reflect", "multi_threaded", "serialize", "async_executor"] }
bevy_reflect = { version = "=0.20.0", default-features = false, features = ["std", "glam", "uuid", "smallvec", "indexmap", "debug", "reflect_documentation"] }
glam = { version = "0.33.12", features = ["serde", "bytemuck"] }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12"
postcard = { version = "1.1", features = ["use-std"] }
blake3 = "1.8"
uuid = { version = "1.27", features = ["v4", "serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
lz4_flex = "0.14"
memmap2 = "0.9"
winit = { version = "0.30.13", features = ["android-game-activity"] }
gilrs = "0.11"
wgpu = "30"
naga_oil = "0.23"
ktx2 = "0.5"
rapier3d = { version = "0.36", features = ["serde-serialize"] }
kira = "0.12.5"
taffy = "0.14"
cosmic-text = "0.19"
fluent-bundle = "0.16"
unic-langid = "0.9"
notify = "8.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
png = "0.18"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
egui_dock = "0.21"
egui-snarl = "0.12"
transform-gizmo-egui = "0.11"
rfd = "0.17"
libloading = "0.9"
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# Copied from the engine workspace (docs/03 § 6).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16
