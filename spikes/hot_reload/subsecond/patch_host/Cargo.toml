[package]
name = "patch_host"
description = "Headless app with the game statically linked, run under `dx serve --hot-patch`."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["hotpatching"]
# bevy_ecs' subsecond integration + the dx devserver connection.
hotpatching = ["bevy_ecs/hotpatching", "dep:dioxus-devtools"]
# Optional: also link the full engine dependency set (to measure patch latency on a big binary).
full = ["dep:spike_engine"]

[dependencies]
regia = { path = "../../../../crates/regia" }
patch_game = { path = "../patch_game" }
regia_app = { path = "../../../../crates/regia_app" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "bevy_reflect", "multi_threaded", "serialize", "async_executor"] }
dioxus-devtools = { version = "0.7.10", optional = true }
spike_engine = { path = "../../crates/spike_engine", optional = true }
